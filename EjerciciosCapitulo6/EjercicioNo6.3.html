      <link rel="stylesheet" href="/Estilos/EstilosAutoEvaluacion.css">

      <style>
         /* Ajustes locales; los archivos .css originales no se modifican */
         ol li          { display: list-item; margin-bottom: 0.8em; }  /* anula li {display: inline} del menú */
         span.respuesta { border-bottom: 1px solid gray; padding: 0 0.3em; }  /* hace visible el espacio en blanco */

      <script>         
         document.writeln( "<h1>Ejercicio de Autoevaluación 6.3</h1>")
         document.writeln( "<p>Pasa el cursor sobre el espacio en blanco de cada inciso para ver la respuesta.</p>" );
         document.writeln( "<ol type='a'>" );
         document.writeln( "<li>Declare las variables <code>c</code>, <code>estaEsUnaVariable</code>, <code>q76354</code> y <code>numero</code>.<p class='respuesta'><code>var c, estaEsUnaVariable, q76354, numero;</code></li>" );
         document.writeln( "<li>Muestre un diálogo que pida al usuario que escriba un entero. Muestre un valor predeterminado de 0 en el diálogo.<p class='respuesta'><code>valor = window.prompt( \"Escriba un entero\", \"0\" );</code></li>" );
         document.writeln( "<li>Convierta una cadena en un entero y almacene el valor convertido en la variable <code>edad</code>. Suponga que la cadena se almacena en <code>valorCadena</code>.<p class='respuesta'><code>var edad = parseInt( valorCadena );</code></li>" );
         document.writeln( "<li>Si la variable <code>numero</code> no es igual a 7, muestre \"La variable numero no es igual a 7\" en un diálogo de mensaje.<p class='respuesta'><code>if ( numero != 7 )<br>&nbsp;&nbsp;&nbsp;window.alert( \"La variable numero no es igual a 7\" );</code></li>" );
         document.writeln( "<li>Produzca una línea de texto de HTML5 que muestre el mensaje \"Esto es JavaScript\" en el documento de HTML5.<p class='respuesta'><code>document.writeln( \"Esto es JavaScript\" );</code></li>" );
         document.writeln( "</ol>" );
      </script>
