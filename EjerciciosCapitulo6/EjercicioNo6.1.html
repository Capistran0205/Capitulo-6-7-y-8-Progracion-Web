<head>
   <meta charset="utf-8">
   <title>Ejercicio de autoevaluación 6.1</title>
   <link rel="stylesheet" href="/Estilos/Botones.css">
   <link rel="stylesheet" href="/Estilos/EstilosAutoEvaluacion.css">
   <style>
      /* Ajustes locales; los archivos .css originales no se modifican */
      ol li {
         display: list-item;
         margin-bottom: 0.8em;
      }

      /* anula li {display: inline} del menú */
      span.respuesta {
         border-bottom: 1px solid gray;
         padding: 0 0.3em;
      }

      /* hace visible el espacio en blanco */
      p.respuesta {
         border-bottom: 1px dotted gray;
      }

      /* hace visible dónde está la respuesta */
      nav {
         margin-top: 2em;
      }
   </style>
   <script>
      document.writeln( "<h1>Ejercicio de autoevaluación 6.1</h1>" );
      document.writeln( "<hr>");
      document.writeln( "<p>Pasa el cursor sobre el espacio en blanco de cada inciso para ver la respuesta.</p>" );
      document.writeln("<ol type='a'>");
      document.writeln("<li><span class='respuesta'>//</span> comienza un comentario de una sola línea.</li>");
      document.writeln("<li>Toda instrucción de JavaScript debe terminar con un(a) <span class='respuesta'>punto y coma (;)</span>.</li>");
      document.writeln("<li>La instrucción <span class='respuesta'>if</span> se utiliza para tomar decisiones.</li>");
      document.writeln("<li>El objeto <span class='respuesta'>window</span> muestra diálogos alert y prompt.</li>");
      document.writeln("<li>Las palabras <span class='respuesta'>clave</span> están reservadas para uso de JavaScript.</li>");
      document.writeln("<li>Los métodos <span class='respuesta'>write</span> y <span class='respuesta'>writeln</span> del objeto <span class='respuesta'>document</span> escriben texto de HTML5 en un documento de HTML5.</li>");
      document.writeln("</ol>");
   </script>
